<script>
// 問題データ: d=難易度, t=分野, a=選択肢, c=正解のindex, e=解説
const BANK = [
  // ───────── 基礎 20問 ─────────
  { d:"基礎", t:"半導体の基礎", q:"温度を上げたとき、金属と真性半導体の導電率はそれぞれどうなるか。",
    a:["金属は下がり、真性半導体は上がる","どちらも上がる","どちらも下がる","金属は上がり、真性半導体は下がる"], c:0,
    e:"金属は温度が上がると原子の熱振動が激しくなって電子が散乱され、導電率が下がります。真性半導体では熱エネルギーで価電子帯から伝導帯へ電子が励起され、キャリアの数そのものが増えるため導電率が上がります。なお不純物を添加した半導体は、室温付近ではキャリア数がほぼ一定(飽和領域)になり移動度の低下が効いてくるため、金属と同じように温度上昇で抵抗が増えることがあります。" },
  { d:"基礎", t:"バンド構造", q:"バンドギャップ(禁制帯幅)とは何か。",
    a:["価電子帯の上端と伝導帯の下端のエネルギー差","伝導帯の下端とフェルミ準位のエネルギー差","伝導帯の幅そのもの","電子が持てる最大のエネルギー"], c:0,
    e:"電子が存在できないエネルギーの範囲がバンドギャップです。この幅を越えるだけのエネルギーをもらった電子だけが、価電子帯から伝導帯へ移って電気を運べるようになります。" },
  { d:"基礎", t:"バンド構造", q:"金属・半導体・絶縁体をバンド構造で区別すると、正しいのはどれか。",
    a:["金属はバンドが重なり、半導体はギャップが小さく、絶縁体はギャップが大きい","金属だけがギャップを持つ","3つともギャップの大きさは同じ","半導体だけバンドが重なっている"], c:0,
    e:"金属はバンドが途中までしか電子で埋まっていない、あるいは価電子帯と伝導帯が重なっているため、常に自由に動ける電子があります。半導体はギャップが小さい(Siで約1.1eV)ので熱や光で電子を励起でき、絶縁体はギャップが大きすぎて通常の条件では電子が越えられません。" },
  { d:"基礎", t:"バンド構造", q:"室温におけるシリコンのバンドギャップはおよそいくらか。",
    a:["約1.1 eV","約0.1 eV","約5.5 eV","約12 eV"], c:0,
    e:"Siは約1.1eVです。参考までにGaAsは約1.4eV、4H-SiCは約3.3eV、GaNは約3.4eV、ダイヤモンドは約5.5eV。ギャップが広い材料ほど高温・高電圧に強く、パワー半導体に使われます。" },
  { d:"基礎", t:"キャリア", q:"真性半導体(不純物を含まない純粋な半導体)のキャリアについて正しいのはどれか。",
    a:["自由電子と正孔が同じ数だけ存在する","自由電子だけが存在する","正孔だけが存在する","キャリアはまったく存在しない"], c:0,
    e:"電子が価電子帯から伝導帯へ1個励起されると、価電子帯には正孔が1個できます。必ずペアで生まれるので、真性半導体では電子濃度と正孔濃度が等しくなります(n = p = n_i)。" },
  { d:"基礎", t:"キャリア", q:"正孔(ホール)とは何か。",
    a:["電子が抜けた空席で、正の電荷をもつ粒子のようにふるまう","共有結合から抜け出して自由に動けるようになった電子","電離した不純物原子が結晶中に固定された正イオン","電子より重い負電荷の粒子"], c:0,
    e:"正孔は「電子の抜けた席」です。周りの電子が次々とその席へ移ることで、結果として空席が電子と逆向きに動きます。これを正の電荷をもつ1個のキャリアとみなすと、電流の計算が扱いやすくなります。" },
  { d:"基礎", t:"ドーピング", q:"シリコンにリン(P)などの5価の元素を添加すると何ができるか。",
    a:["n型半導体。多数キャリアは電子","p型半導体。多数キャリアは正孔","絶縁体になる","真性半導体のまま変わらない"], c:0,
    e:"5価の原子は共有結合に4個使うと電子が1個余り、これがわずかなエネルギーで自由電子になります。電子を供給するのでドナーと呼び、negative(負)のnをとってn型といいます。" },
  { d:"基礎", t:"ドーピング", q:"p型半導体をつくるために添加する不純物はどれか。",
    a:["ホウ素(B)などの3価の元素","リン(P)などの5価の元素","ヒ素(As)などの5価の元素","ゲルマニウム(Ge)などの4価の元素"], c:0,
    e:"3価の原子は共有結合をつくるのに電子が1個足りず、近くの価電子帯から電子を受け取ります。その結果アクセプタ自身は負イオンとして固定され、電子が抜けた席が正孔として結晶中を動き回ります。電子を受け取るのでアクセプタと呼び、positive(正)のpをとってp型といいます。" },
  { d:"基礎", t:"電流", q:"ドリフト電流と拡散電流の違いとして正しいのはどれか。",
    a:["ドリフトは電界による流れ、拡散は濃度勾配による流れ","ドリフトは多数キャリア、拡散は少数キャリアだけの流れ","ドリフトは電子だけ、拡散は正孔だけの流れ","違いはなく同じものを指す"], c:0,
    e:"電圧をかけて電界でキャリアを引っぱるのがドリフト電流、キャリアが濃いところから薄いところへ自然に広がるのが拡散電流です。平衡状態のpn接合では、この2つがちょうど打ち消し合って正味の電流がゼロになっています。" },
  { d:"基礎", t:"キャリア", q:"室温のシリコン中の移動度について正しいのはどれか。",
    a:["電子のほうが正孔より大きい","正孔のほうが電子より大きい","両者は完全に等しい","移動度は温度に無関係"], c:0,
    e:"低ドープのSiでは室温で電子が約1350、正孔が約480 cm²/(V·s)。電子のほうが約2.8倍(ざっと3倍)動きやすいことになります。CMOSでpMOSのほうが電流を流しにくいのはこのためで、設計ではpMOSのチャネル幅を広げて釣り合わせます。なお不純物濃度が10¹⁸ cm⁻³ を超えると、不純物散乱で移動度は大きく下がります。" },
  { d:"基礎", t:"pn接合", q:"pn接合の接合部にできる空乏層とはどんな領域か。",
    a:["キャリアが拡散・再結合して消え、イオン化した不純物だけが残った領域","電子と正孔が同数になり、電気的に中性になった領域","電子だけが極端に多い領域","電流がもっとも流れやすい領域"], c:0,
    e:"接合直後、n側の電子とp側の正孔が拡散して出会い再結合します。あとに残された固定イオン(n側は正、p側は負)が電界をつくり、それ以上の拡散を止めます。この可動キャリアが枯渇した層が空乏層です。" },
  { d:"基礎", t:"pn接合", q:"室温のシリコンpn接合の内蔵電位(拡散電位)は、一般的な不純物濃度でおよそいくらか。",
    a:["0.6〜0.8 V程度","0.05 V程度","5 V程度","50 V程度"], c:0,
    e:"Siでは0.7V前後で、正確な値は両側の不純物濃度で決まります(濃くドープするほど大きい)。この電位差が、拡散しようとするキャリアをせき止める「坂」の高さにあたります。" },
  { d:"基礎", t:"pn接合", q:"pn接合に順方向バイアス(p側に+、n側に−)をかけると空乏層はどうなるか。",
    a:["狭くなり、電流が流れやすくなる","広がり、電流が流れにくくなる","幅は変わらないまま、電流だけが増える","変化しない"], c:0,
    e:"外部電圧が内蔵電位を打ち消す向きに働くので、電位の坂が低くなり空乏層が狭まります。多数キャリアが相手側へ次々と注入されるようになり、大きな電流が流れます。" },
  { d:"基礎", t:"ダイオード", q:"逆方向電圧を上げていくと、ある電圧で急に大電流が流れる現象を何というか。",
    a:["降伏(ブレークダウン)","飽和","ピンチオフ","反転"], c:0,
    e:"比較的低い電圧ではトンネル効果によるツェナー降伏、高い電圧では加速された電子が次々と結合を壊すなだれ降伏が起こります。壊れる現象と思われがちですが、電流さえ制限すれば電圧が一定に保たれるので、定電圧ダイオード(ツェナーダイオード)として積極的に利用されます。" },
  { d:"基礎", t:"MOSの構造", q:"nチャネルMOSFETの基本構造として正しいのはどれか。",
    a:["p型基板にn⁺のソースとドレインを作る","n型基板にn⁺のソースとドレインを作る","p型基板にp⁺のソースとドレインを作る","絶縁体の基板に金属電極を並べる"], c:0,
    e:"nMOSはp型基板上にn⁺のソース・ドレインを配置します。ゲートに正電圧を加えると基板表面のp型が反転して電子の層(nチャネル)ができ、ソースとドレインがつながって電流が流れます。" },
  { d:"基礎", t:"MOSの動作", q:"MOSFETのしきい値電圧(Vth)とは何か。",
    a:["チャネルが形成されて電流が流れ始めるゲート電圧","ドレイン電流が飽和し始めるドレイン電圧","素子が壊れる限界の電圧","ドレインに加えられる最大電圧"], c:0,
    e:"ゲート電圧がVthを超えると反転層(チャネル)ができ、ドレイン電流が流れ始めます。Vthはデジタル回路の0と1を分ける基準であり、動作速度と消費電力(オフ時の漏れ電流)を左右する重要な設計パラメータです。" },
  { d:"基礎", t:"CMOS", q:"CMOS回路の最大の利点は何か。",
    a:["静止時の消費電力がほぼゼロになること","動作させるクロック周波数を自由に上げられること","電源電圧を高くできること","1種類のトランジスタだけで回路を作れること"], c:0,
    e:"nMOSとpMOSを相補的に組み合わせるため、入力が0でも1でも必ずどちらか一方がOFFになり、電源からグランドへ電流が流れません。電流が流れるのは切り替わる瞬間だけです(ただし微細化が進んだ現代のチップでは、OFF時のリーク電流が無視できない大きさになっています)。" },
  { d:"基礎", t:"CMOS", q:"CMOSインバータの入力にHigh(電源電圧)を与えたとき、内部はどうなるか。",
    a:["nMOSがON、pMOSがOFFになり、出力はLow","nMOSがOFF、pMOSがONになり、出力はHigh","両方ONになり出力は中間電位","両方OFFになり出力はHigh"], c:0,
    e:"入力Highでは、nMOSはゲート電圧が高くONになり、pMOSはゲート-ソース間電圧がほぼ0でOFFになります。出力はnMOS経由でグランドに引き下げられてLowになり、これが反転(NOT)動作です。" },
  { d:"基礎", t:"製造プロセス", q:"半導体製造の「前工程」と「後工程」の区分として正しいのはどれか。",
    a:["前工程はウェハ上に素子を作り込む工程、後工程は切り出してパッケージする工程","前工程はチップの検査、後工程はウェハへの回路形成","前工程は設計、後工程は製造","前工程は検査、後工程は出荷"], c:0,
    e:"前工程は成膜・リソグラフィ・エッチング・イオン注入などをくり返してウェハ上に回路を作り込む工程です。後工程はダイシング(切り出し)、ボンディング、封止、最終検査を指します。" },
  { d:"基礎", t:"製造プロセス", q:"フォトリソグラフィ工程の役割は何か。",

  // ───────── 応用 10問 ─────────

  { d:"応用", t:"バンド構造", q:"非縮退の(通常のドーピング濃度の)n型半導体では、フェルミ準位はどの位置に移動するか。",

  { d:"応用", t:"pn接合", q:"p⁺n接合(p側の不純物濃度がn側よりずっと高い片側階段接合)で、空乏層はどのように広がるか。",
    a:["濃度の低いn側に大きく広がる","濃度の高いp側に大きく広がる","両側に同じ幅で広がる","どちらにも広がらない"], c:0,
    e:"空乏層の両側にある正負の電荷量は等しくなければならないので、N_A·x_p = N_D·x_n が成り立ちます。濃度が低い側ほど同じ電荷量を得るのに広い幅が必要になるため、空乏層は低濃度側(この場合n側)に大きく伸びます。耐圧を上げたいときに低濃度層を厚く設ける設計は、この関係を利用したものです。" },
  { d:"応用", t:"pn接合", q:"pn接合ダイオードに加える逆方向電圧を大きくすると、接合容量はどうなるか。",
    a:["空乏層が広がるので小さくなる","空乏層が広がるので大きくなる","空乏層は広がるが、容量は変わらない","変化しない"], c:0,
    e:"空乏層を誘電体、その両側を電極と見なすと C = εA/W の平行平板コンデンサとみなせます。逆バイアスを強めると空乏層幅Wが広がるので容量Cは小さくなります。この電圧で容量が変わる性質を積極的に使うのが可変容量ダイオード(バラクタ)で、高周波の同調回路などに用いられます。" },
  { d:"応用", t:"ダイオード", q:"理想ダイオード式 I = I_s{exp(V/V_T) − 1} において、室温の熱電圧 V_T ≒ 26 mV とする。順方向電流を10倍にするには順方向電圧をおよそいくら増やせばよいか。",
    a:["約60 mV","約26 mV","約260 mV","約700 mV"], c:0,
    e:"順方向では指数項が支配的なので I ∝ exp(V/V_T)。電流を10倍にする電圧差は ΔV = V_T·ln10 = 26 mV × 2.30 ≒ 60 mV です。片対数グラフ上でI-V特性が直線になり、その傾きが1桁あたり約60mVになるのはこのためです。" },
  { d:"応用", t:"ダイオード", q:"シリコンで高効率な発光ダイオード(LED)が作れないのはなぜか。",
    a:["Siは間接遷移型半導体で、再結合のエネルギーが光になりにくいから","Siのバンドギャップが大きすぎて可視光が出ないから","Siは電子の移動度が小さく、大きな電流を流せないから","Siは高温に耐えられないから"], c:0,
    e:"間接遷移型のSiでは伝導帯の底と価電子帯の頂点で運動量がずれており、再結合するには格子振動(フォノン)が同時に関わる必要があります。この三者がそろう確率は低く発光再結合が起こりにくいため、その間に結晶欠陥を介した非発光再結合(エネルギーが熱になる過程)が優先してしまい、発光効率が上がりません。LEDには運動量のずれがない直接遷移型のGaNやGaAsが使われます。" },
  { d:"応用", t:"MOSの動作", q:"長チャネルMOSFETの飽和領域では I_D ∝ (V_GS − V_th)² が成り立つ。V_GS − V_th を 0.4 V から 0.8 V に増やすと、ドレイン電流はおよそ何倍になるか。",
    a:["約4倍","約2倍","約1.4倍","約8倍"], c:0,
    e:"(V_GS − V_th) が2倍になると、二乗則により電流は2² = 4倍になります。なお微細化した短チャネルデバイスでは、キャリアの速度が飽和するため二乗則から外れ、電流は (V_GS − V_th) にほぼ比例するようになります。" },
  { d:"応用", t:"MOSの動作", q:"MOSFETの飽和領域で、ドレイン電圧を上げてもドレイン電流がほとんど増えなくなるのはなぜか。",
    a:["ドレイン側のチャネルが消えて(ピンチオフ)、それ以上電圧を上げても実効的な条件が変わらないから","チャネルの抵抗が電圧に比例して増えるから","ゲート酸化膜が絶縁破壊を起こすから","キャリアがすべて再結合して消えるから"], c:0,
    e:"V_DS が V_GS − V_th を超えると、ドレイン端ではゲートとチャネルの電位差がV_thを下回り反転層が途切れます(ピンチオフ)。それ以上V_DSを上げても、ピンチオフ点までの電圧はほぼ一定に保たれ、増えた分は空乏層にかかるため電流はほぼ一定になります。この定電流性が増幅回路で活用されます。" },
  { d:"応用", t:"CMOS", q:"CMOS回路の動的消費電力は P = α·C·V_DD²·f で表される。動作周波数と容量を変えずに電源電圧 V_DD を半分にすると、動的消費電力はおよそどうなるか。",
    a:["約1/4になる","約1/2になる","変わらない","約2倍になる"], c:0,
    e:"電圧の2乗に比例するので、V_DDを1/2にすると (1/2)² = 1/4 になります。低電圧化が省電力にきわめて有効なのはこのためです。ただし電圧を下げるとトランジスタの駆動電流も減って回路が遅くなるため、どこまで下げられるかは動作速度とのトレードオフになります。" },
  { d:"応用", t:"微細化", q:"FinFETやGAA(ゲートオールアラウンド)構造が導入された主な理由は何か。",
    a:["ゲートがチャネルを立体的に囲んで制御力を高め、短チャネル効果を抑えるため","配線層を減らしてチップを薄くするため","ゲート酸化膜を厚くして高電圧に耐えるため","製造工程を減らしてコストを下げるため"], c:0,
    e:"微細化でチャネルが短くなると、ドレインの電界がチャネル電位に影響してゲートが制御しきれなくなり、OFFにしても漏れ電流が流れます(短チャネル効果)。チャネルをヒレ状に立てて三方から、さらにGAAでは全周から囲むことでゲートとチャネルの結合を強め、制御力を取り戻しています。" }
];

const N_BASIC = 7, N_ADV = 3, N = N_BASIC + N_ADV;
const panel = document.getElementById("panel");
const KEY = ["A","B","C","D"];
let quiz = [], idx = 0, answers = [], locked = false;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 選択肢もシャッフルするので、同じ位置が常に正解になることはない
function prepare(item) {
  const order = shuffle(item.a.map((text, i) => ({ text, i })));
  return {
    d: item.d, t: item.t, q: item.q, e: item.e,
    a: order.map(o => o.text),
    c: order.findIndex(o => o.i === item.c)
  };
}

// 基礎7問→応用3問の順に出題する(難易度が上がっていく構成)
function buildQuiz() {
  const basic = shuffle(BANK.filter(x => x.d === "基礎")).slice(0, N_BASIC);
  const adv = shuffle(BANK.filter(x => x.d === "応用")).slice(0, N_ADV);
  quiz = basic.concat(adv).map(prepare);
  answers = new Array(N).fill(null);
  idx = 0;
  locked = false;
}

function esc(s) {
  return s.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
}

// V_GS のようなアンダースコア記法を下付き文字で表示する(エスケープ後に置換)
function fmt(s) {
  return esc(s).replace(/\b([A-Za-z])_([A-Za-z]{1,2})\b/g, "$1<sub>$2</sub>");
}

function tagsHtml(item) {
  return `<div class="tags"><span class="tag">${esc(item.t)}</span>` +
         (item.d === "応用" ? `<span class="tag adv">応用</span>` : "") + `</div>`;
}

function renderStart() {
  const nb = BANK.filter(x => x.d === "基礎").length;
  const na = BANK.filter(x => x.d === "応用").length;
  panel.innerHTML = `
    <h2 style="margin:0 0 10px; font-size:1.2rem;">全${BANK.length}問からランダム${N}問</h2>
    <p class="lead">講義全15回の範囲から、<strong>基礎${N_BASIC}問+応用${N_ADV}問</strong>を出題します
    (問題バンクは基礎${nb}問・応用${na}問)。応用には計算問題も含まれます。
    1問ずつ答えるとその場で正誤と解説が出て、最後に得点と全問の振り返りを表示します。</p>
    <button class="btn" id="start">クイズをはじめる</button>`;
  document.getElementById("start").onclick = () => { buildQuiz(); renderQuestion(); };
}

function renderQuestion() {
  const item = quiz[idx];
  const pct = Math.round((idx / N) * 100);
  panel.innerHTML = `
    <div class="meta"><span>第${idx + 1}問 / ${N}問</span><span>正解 ${countCorrect()}問</span></div>
    <div class="bar"><span style="width:${pct}%"></span></div>
    ${tagsHtml(item)}
    <p class="q">${fmt(item.q)}</p>
    <ul class="choices" id="choices">
      ${item.a.map((text, i) => `
        <li><button type="button" data-i="${i}">
          <span class="k">${KEY[i]}</span><span>${fmt(text)}</span>
        </button></li>`).join("")}
    </ul>
    <div id="after"></div>`;
  locked = false;
  document.getElementById("choices").querySelectorAll("button").forEach(b => {
    b.onclick = () => choose(Number(b.dataset.i));
  });
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function choose(pick) {
  if (locked) return;
  locked = true;
  answers[idx] = pick;
  const item = quiz[idx];
  const ok = pick === item.c;
  document.getElementById("choices").querySelectorAll("button").forEach(b => {
    const i = Number(b.dataset.i);
    b.disabled = true;
    if (i === item.c) b.classList.add("correct");
    else if (i === pick) b.classList.add("wrong");
  });
  const last = idx === N - 1;
  document.getElementById("after").innerHTML = `
    <p class="judge ${ok ? "ok" : "ng"}">${ok ? "◯ 正解" : "✗ 不正解 — 正解は " + KEY[item.c]}</p>
    <div class="exp"><p>${fmt(item.e)}</p></div>
    <button class="btn" id="next">${last ? "結果を見る" : "次の問題へ"}</button>`;
  document.getElementById("next").onclick = () => {
    if (last) renderResult();
    else { idx++; renderQuestion(); }
  };
}

function countCorrect(kind) {
  return answers.reduce((n, a, i) =>
    n + ((a !== null && a === quiz[i].c && (!kind || quiz[i].d === kind)) ? 1 : 0), 0);
}

function renderResult() {
  const score = countCorrect();
  const msg = score === N ? "満点です。応用問題まで文句なしの理解度です"
            : score >= 8 ? "よく理解できています"
            : score >= 6 ? "基礎は身についています。あと一歩"
            : score >= 4 ? "要復習。解説を読んで確認しましょう"
            : "まずは講義動画と図解で基礎から確認しましょう";
  panel.innerHTML = `
    <div class="score">
      <div class="n">${score}<small> / ${N}問正解</small></div>
      <p class="msg">${msg}</p>
      <div class="bd">
        <div>基礎 <b>${countCorrect("基礎")} / ${N_BASIC}</b></div>
        <div>応用 <b>${countCorrect("応用")} / ${N_ADV}</b></div>
      </div>
      <p class="sub">下に全${N}問の正解と解説をまとめました。まちがえた分野を確認しましょう。</p>
    </div>
    <ol class="review">
      ${quiz.map((item, i) => {
        const ok = answers[i] === item.c;
        return `<li>
          <div class="rh">${item.d === "応用" ? '<span class="tag adv">応用</span>' : ""}
            <span class="tag">${esc(item.t)}</span></div>
          <p class="rq">${fmt(item.q)}</p>
          <p class="ans"><span class="mark ${ok ? "ok" : "ng"}">${ok ? "◯" : "✗"}</span>
             正解: ${KEY[item.c]} ${fmt(item.a[item.c])}</p>
          ${ok ? "" : `<p class="ans yours">あなたの解答: ${KEY[answers[i]]} ${fmt(item.a[answers[i]])}</p>`}
          <p class="rexp">${fmt(item.e)}</p>
        </li>`;
      }).join("")}
    </ol>
    <div class="actions">
      <button class="btn" id="again">もう一度挑戦する</button>
      <a class="btn sub" href="./">図解で復習する</a>
    </div>`;
  document.getElementById("again").onclick = () => { buildQuiz(); renderQuestion(); };
  window.scrollTo({ top: 0, behavior: "smooth" });
}

renderStart();
</script>

<script>
setTimeout(() => {
  document.getElementById("start").click();
  let n = 0;
  const step = () => {
    const b = document.querySelectorAll("#choices button");
    if (!b.length) return;
    b[n % 4 === 0 ? 1 : 0].click();
    n++;
    setTimeout(() => { document.getElementById("next").click(); if (n < 10) setTimeout(step, 25); }, 25);
  };
  step();
}, 60);
</script>
