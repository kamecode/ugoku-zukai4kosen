<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;background:#ffffff;font-family:'Noto Sans CJK JP',sans-serif;}
  #stage{width:1180px;height:780px;position:relative;background:#fff;}
  svg{display:block;}
  .ttl{font-size:28px;font-weight:700;fill:#0D3C6E;}
  .sub{font-size:15px;fill:#555;}
  .lab{font-size:16px;fill:#222;}
  .labb{font-size:16px;font-weight:700;fill:#222;}
  .blue{fill:#1565C0;}.orange{fill:#E65100;}.red{fill:#D32F2F;}.gray{fill:#9E9E9E;}.purple{fill:#6A1B9A;}
  .small{font-size:13px;fill:#555;}
  .mono{font-family:'DejaVu Sans Mono',monospace;}
  .panel{position:absolute;left:40px;top:622px;width:1100px;}
  .ctl{display:inline-block;margin-right:36px;font-size:15px;color:#222;vertical-align:middle;}
  input[type=range]{width:220px;vertical-align:middle;}
  .v1c{color:#1565C0;font-weight:700;}
  .v2c{color:#6A1B9A;font-weight:700;}
  .voc{color:#E65100;font-weight:700;}
  #valbox{font-family:'DejaVu Sans Mono',monospace;font-size:17px;margin-top:10px;}
</style>
</head>
<body>
<div id="stage">
<svg id="svg" width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrB" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#1565C0"/></marker>
  </defs>

  <text x="40" y="40" class="ttl">減算回路：＋入力を分圧 → 仮想短絡で −入力も同じ電位に</text>
  <line x1="40" y1="54" x2="1140" y2="54" stroke="#0D3C6E" stroke-width="2"/>
  <text x="40" y="78" class="sub">＋入力側で V2 を半分に分圧（V2/2）。仮想短絡で −入力も V2/2 になり、そこを基準に V1 が反転増幅される　R1=R2=Rf=R3=10kΩ → Vout = V2 − V1</text>

  <!-- OPアンプ -->
  <polygon points="600,250 600,390 760,320" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <text x="624" y="314" class="labb">NJM4558</text>
  <text x="632" y="334" class="small">A回路</text>
  <text x="612" y="282" class="labb red">−</text>
  <text x="611" y="368" class="labb blue">＋</text>

  <!-- 反転側 V1 → R1 → -入力 -->
  <circle cx="110" cy="200" r="24" fill="#fff" stroke="#1565C0" stroke-width="2.5"/>
  <text x="110" y="196" text-anchor="middle" class="small blue">FG</text>
  <text x="110" y="213" text-anchor="middle" class="labb blue">V1</text>
  <line x1="110" y1="224" x2="110" y2="276" stroke="#1565C0" stroke-width="2"/>
  <line x1="110" y1="276" x2="200" y2="276" stroke="#1565C0" stroke-width="2"/>
  <rect x="200" y="266" width="76" height="20" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="238" y="260" text-anchor="middle" class="lab">R1 10kΩ</text>
  <line x1="276" y1="276" x2="600" y2="276" stroke="#222" stroke-width="2"/>
  <circle cx="450" cy="276" r="4.5" fill="#222"/>
  <text x="396" y="260" class="small">−入力ノード</text>

  <!-- 帰還 Rf -->
  <line x1="760" y1="320" x2="840" y2="320" stroke="#222" stroke-width="2"/>
  <circle cx="840" cy="320" r="4.5" fill="#222"/>
  <line x1="840" y1="320" x2="840" y2="150" stroke="#222" stroke-width="2"/>
  <line x1="840" y1="150" x2="530" y2="150" stroke="#222" stroke-width="2"/>
  <rect x="451" y="140" width="78" height="20" fill="#fff" stroke="#E65100" stroke-width="2"/>
  <text x="490" y="134" text-anchor="middle" class="labb orange">Rf 10kΩ</text>
  <line x1="451" y1="150" x2="450" y2="150" stroke="#222" stroke-width="2"/>
  <line x1="450" y1="150" x2="450" y2="276" stroke="#222" stroke-width="2"/>

  <!-- 非反転側 V2 → R2 → +入力, +入力 → R3 → GND -->
  <circle cx="110" cy="470" r="24" fill="#fff" stroke="#6A1B9A" stroke-width="2.5"/>
  <text x="110" y="466" text-anchor="middle" class="small purple">FG</text>
  <text x="110" y="483" text-anchor="middle" class="labb purple">V2</text>
  <line x1="110" y1="446" x2="110" y2="364" stroke="#6A1B9A" stroke-width="2"/>
  <line x1="110" y1="364" x2="200" y2="364" stroke="#6A1B9A" stroke-width="2"/>
  <rect x="200" y="354" width="76" height="20" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="238" y="348" text-anchor="middle" class="lab">R2 10kΩ</text>
  <line x1="276" y1="364" x2="600" y2="364" stroke="#222" stroke-width="2"/>
  <circle cx="450" cy="364" r="4.5" fill="#222"/>
  <!-- R3 縦置き → GND -->
  <line x1="450" y1="364" x2="450" y2="410" stroke="#222" stroke-width="2"/>
  <rect x="440" y="410" width="20" height="70" fill="#fff" stroke="#6A1B9A" stroke-width="2"/>
  <text x="470" y="450" class="lab purple">R3 10kΩ</text>
  <line x1="450" y1="480" x2="450" y2="516" stroke="#222" stroke-width="2"/>
  <g stroke="#777" stroke-width="2"><line x1="434" y1="516" x2="466" y2="516"/><line x1="439" y1="522" x2="461" y2="522"/><line x1="444" y1="528" x2="456" y2="528"/></g>

  <!-- 出力 -->
  <line x1="840" y1="320" x2="980" y2="320" stroke="#E65100" stroke-width="2.5"/>
  <circle cx="980" cy="320" r="4.5" fill="#E65100"/>
  <text x="848" y="310" class="labb orange">Vout</text>

  <!-- 電源 -->
  <line x1="684" y1="286" x2="684" y2="214" stroke="#D32F2F" stroke-width="2"/>
  <circle cx="684" cy="286" r="3.5" fill="#D32F2F"/>
  <text x="696" y="208" class="small red">V+ = +8V（pin8）</text>
  <line x1="684" y1="354" x2="684" y2="420" stroke="#1565C0" stroke-width="2"/>
  <circle cx="684" cy="354" r="3.5" fill="#1565C0"/>
  <text x="696" y="434" class="small blue">V− = −8V（pin4）</text>

  <!-- ノード電位の表示（仮想短絡の肝） -->
  <rect x="486" y="286" width="104" height="22" rx="4" fill="#fff8e1" stroke="#E65100" stroke-width="1"/>
  <text x="538" y="301" text-anchor="middle" class="small orange mono" id="vminus">−入力 = +0.5V</text>
  <rect x="486" y="372" width="104" height="22" rx="4" fill="#f3e5f5" stroke="#6A1B9A" stroke-width="1"/>
  <text x="538" y="387" text-anchor="middle" class="small purple mono" id="vplus">＋入力 = +0.5V</text>
  <text x="486" y="416" class="small purple">＝ V2/2（分圧）</text>
  <text x="486" y="338" class="small orange">＝ 仮想短絡で同じ</text>

  <!-- 電流の粒（入力側のみ） -->
  <g id="dotsV1"></g>

  <!-- 右：出力バーグラフ -->
  <g id="bars" transform="translate(1010,110)">
    <text x="0" y="-16" class="labb">入出力（V）</text>
    <line x1="-10" y1="160" x2="150" y2="160" stroke="#888" stroke-width="1.2"/>
    <text x="-34" y="44" class="small">+8</text>
    <text x="-34" y="164" class="small">0</text>
    <text x="-34" y="284" class="small">−8</text>
    <line x1="-10" y1="40" x2="150" y2="40" stroke="#eee" stroke-width="1"/>
    <line x1="-10" y1="280" x2="150" y2="280" stroke="#eee" stroke-width="1"/>
    <line x1="-10" y1="55" x2="150" y2="55" stroke="#f3c" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5"/>
    <line x1="-10" y1="265" x2="150" y2="265" stroke="#f3c" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5"/>
    <rect id="barV1" x="6" y="160" width="34" height="0" fill="#1565C0"/>
    <rect id="barV2" x="50" y="160" width="34" height="0" fill="#6A1B9A"/>
    <rect id="barVo" x="100" y="160" width="40" height="0" fill="#E65100"/>
    <text x="23" y="300" text-anchor="middle" class="small blue">V1</text>
    <text x="67" y="300" text-anchor="middle" class="small purple">V2</text>
    <text x="120" y="300" text-anchor="middle" class="small orange">Vout</text>
  </g>
</svg>

<div class="panel">
  <span class="ctl">入力 <span class="v1c">V1</span>: <input id="s1" type="range" min="-4" max="4" step="0.5" value="1"> <span id="v1lab" class="v1c">+1.0 V</span></span>
  <span class="ctl">入力 <span class="v2c">V2</span>: <input id="s2" type="range" min="-4" max="4" step="0.5" value="3"> <span id="v2lab" class="v2c">+3.0 V</span></span>
  <div id="valbox">
    ＋入力 = V2 × R3/(R2+R3) = V2/2 = <span class="v2c" id="vp">+1.5</span> V　→（仮想短絡）→　−入力も同じ = <span class="voc" id="vm">+1.5</span> V
    <br>Vout = V2 − V1 = <span class="voc" id="voutv">+2.0 V</span> <span id="satlab" style="color:#c2185b"></span>
  </div>
</div>
</div>

<script>
const s1=document.getElementById('s1'), s2=document.getElementById('s2');
const VRAIL=7.0, PXV=15;
const dotsV1=document.getElementById('dotsV1');

// 反転側ループ：V1→R1→-入力ノード
const pathV1=[[276,276],[450,276],[600,276]];                 // R1出口→-入力

function lerpPath(path,t){let s=[],T=0;for(let i=0;i<path.length-1;i++){const l=Math.hypot(path[i+1][0]-path[i][0],path[i+1][1]-path[i][1]);s.push(l);T+=l;}let d=t*T;for(let i=0;i<s.length;i++){if(d<=s[i]){const r=d/s[i];return[path[i][0]+(path[i+1][0]-path[i][0])*r,path[i][1]+(path[i+1][1]-path[i][1])*r];}d-=s[i];}return path[path.length-1];}

let st={v1:[]};
function makeDots(g,n,c,store){g.innerHTML='';store.length=0;for(let i=0;i<n;i++){const e=document.createElementNS('http://www.w3.org/2000/svg','circle');e.setAttribute('r','4');e.setAttribute('fill',c);g.appendChild(e);store.push({el:e,phase:i/n});}}

let V1=1,V2=3;
function update(){
  V1=parseFloat(s1.value);V2=parseFloat(s2.value);
  document.getElementById('v1lab').textContent=(V1>=0?'+':'')+V1.toFixed(1)+' V';
  document.getElementById('v2lab').textContent=(V2>=0?'+':'')+V2.toFixed(1)+' V';
  const vp=V2/2;
  document.getElementById('vp').textContent=(vp>=0?'+':'')+vp.toFixed(1);
  document.getElementById('vm').textContent=(vp>=0?'+':'')+vp.toFixed(1);
  document.getElementById('vplus').textContent='＋入力 = '+(vp>=0?'+':'')+vp.toFixed(1)+'V';
  document.getElementById('vminus').textContent='−入力 = '+(vp>=0?'+':'')+vp.toFixed(1)+'V';
  let vout=V2-V1, sat=false;
  if(vout>VRAIL){vout=VRAIL;sat=true;}if(vout<-VRAIL){vout=-VRAIL;sat=true;}
  document.getElementById('voutv').textContent=(vout>=0?'+':'')+vout.toFixed(1)+' V';
  document.getElementById('satlab').textContent=sat?'　← 出力飽和（レールに張り付き）':'';
  const setBar=(id,val)=>{const b=document.getElementById(id);const h=Math.abs(val)*PXV;b.setAttribute('height',h);b.setAttribute('y',val>=0?160-h:160);};
  setBar('barV1',V1);setBar('barV2',V2);setBar('barVo',vout);
  // 反転側の電流 i1 = (V1 - V(-入力))/R1 = (V1 - V2/2)/10  [mA]
  const i1=(V1 - vp)/10;
  const n1=Math.max(1,Math.round(Math.abs(i1)*30));
  makeDots(dotsV1,n1,'#1565C0',st.v1);
  window._i1=i1;
}
s1.oninput=update;s2.oninput=update;

let t0=performance.now();
function anim(now){const dt=(now-t0)/1000;t0=now;const dir=Math.sign(window._i1||0);
  const mv=(store,path,d)=>{store.forEach(o=>{o.phase+=d*dt*0.4;o.phase=((o.phase%1)+1)%1;const p=lerpPath(path,o.phase);o.el.setAttribute('cx',p[0]);o.el.setAttribute('cy',p[1]);});};
  mv(st.v1,pathV1,dir);
  requestAnimationFrame(anim);}
update();requestAnimationFrame(anim);
</script>
</body>
</html>
